name: Validate template
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      online_setup:
        description: Download and test tools in a fresh workstation (slower, network required)
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check publication boundaries
        shell: pwsh
        run: ./Tools/Test-Repository.ps1 -IncludeHistory
      - name: Test publication guards
        shell: pwsh
        run: ./Tools/Test-RepositoryChecks.ps1
      - name: Validate on Windows PowerShell 5.1
        shell: powershell
        run: ./Tools/Test-Template.ps1 -RequireBackupTests
      - name: Validate on PowerShell 7
        shell: pwsh
        run: ./Tools/Test-Template.ps1 -RequireBackupTests
  online:
    if: github.event_name == 'workflow_dispatch' && inputs.online_setup
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Provision and test a fresh workstation
        shell: ${{ matrix.shell }}
        run: ./Tools/Test-OnlineSetup.ps1
